<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>🖼️ Галерея</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="gallery">
    <h1>Выбор персонажа</h1>

    <div class="container">
        <img id="mainImage" src="" alt="Загрузка...">
    </div>

    <div class="container" >
        <button type="button" class="btn btn-primary" id="prevBtn">◀ Назад</button>
        <span id="counter">0 / 0</span>
        <button type="button" class="btn btn-primary" id="nextBtn">Вперед ▶</button>
    </div>

    <div class="container" style="margin-top: 15px;">
        <button type="button" class="btn btn-warning" id="selectBtn">Выбрать</button>
        <button type="button" class="btn btn-success" id="startBtn">Старт</button>
    </div>
</div>

<!-- Скрытый Canvas контейнер -->
<div id="canvasContainer" class="canvas-container">
    <canvas id="gameCanvas"></canvas>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="./entities/Hero.js"></script>
<script src="game.js"></script>
<script src="script.js"></script>

</body>
</html>
