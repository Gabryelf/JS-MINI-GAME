<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>🖼️ Галерея</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery">
        <h1>🖼️ Галерея героев | Выбор персонажа</h1>
        
        <div class="image-container">
            <img id="mainImage" src="" alt="Загрузка...">
        </div>
        
        <div class="controls">
            <button id="prevBtn">◀ Назад</button>
            <span id="counter">0 / 0</span>
            <button id="nextBtn">Вперед ▶</button>
        </div>

        <div class="controls" style="margin-top: 15px;">
            <button id="selectBtn">⭐ Выбрать</button>
            <button id="startBtn">🚀 Старт</button>
        </div>
    </div>

    <!-- Скрытый Canvas контейнер -->
    <div id="canvasContainer" class="canvas-container">
        <canvas id="gameCanvas"  width="1000px" height="1000px"></canvas>
    </div>
    
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
