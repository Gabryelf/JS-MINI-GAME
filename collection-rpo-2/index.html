<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="gallery">
            <img src="" id="mainImage" alt="image">
        </div>

        <div class="counter">
            <span id="count"></span>
        </div>

        <div class="controller">
            <button type="button" class="btn btn-primary" id="prewBut">⏪</button>
            <button type="button" class="btn btn-success" id="selectBut">Начать</button>
            <button type="button" class="btn btn-primary" id="nextBut">⏩</button>

        </div>
    </div>

    <div id="canvasContainer" class="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script src="config.js"></script>
    <script src="game.js"></script>
    <script src="script.js"></script>
</body>
</html>
